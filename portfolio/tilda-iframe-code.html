<div id="besay-portfolio-frame"></div>

<script>
(function () {
  var portfolioUrl = "https://dobroeee.github.io/besay/portfolio/";
  var holder = document.getElementById("besay-portfolio-frame");
  if (!holder) return;

  var iframe = document.createElement("iframe");
  iframe.src = portfolioUrl + "?v=" + new Date().getTime();
  iframe.style.width = "100%";
  iframe.style.height = "3000px";
  iframe.style.border = "0";
  iframe.style.display = "block";
  iframe.loading = "lazy";
  holder.appendChild(iframe);

  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== "besay-open-popup") return;
    window.location.hash = event.data.hash || "#popup:myformbesay";
  });
})();
</script>
